name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The TigerBeetle client is cgo. Nothing here builds without it, and no
  # cross-compilation is available.
  CGO_ENABLED: "1"

jobs:
  test:
    name: build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      - name: unit tests
        run: make test

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # The easyjson marshalers are committed, so a struct edited without
      # regenerating them would compile and silently keep the old wire shape.
      - name: generated marshalers are current
        run: |
          go install "github.com/mailru/easyjson/...@$(go list -m -f '{{.Version}}' github.com/mailru/easyjson)"
          go install golang.org/x/tools/cmd/goimports@latest
          make generate
          git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Installed directly rather than through the action: this pins the exact
      # binary the project is verified against, and the config uses the v2
      # schema, which not every action major understands.
      - name: lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          make lint

  integration:
    name: integration (Redpanda + TigerBeetle) and coverage
    runs-on: ubuntu-latest
    # contents: write is for pushing the badge to the orphan "badges" branch.
    # The default GITHUB_TOKEN is read-only, which is why the first attempt got
    # a 403 from github-actions[bot].
    permissions:
      contents: write
    # Containers are pulled and booted per test; locally the suite is ~3.5
    # minutes, and a cold runner is slower.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # "make coverage" runs the integration suite -- testcontainers starts
      # TigerBeetle privileged because it needs io_uring, which GitHub's Linux
      # runners allow and a hardened self-hosted runner may not -- and the unit
      # suite alongside it, merging both into one profile. The two have to be
      # measured together: cmd/kafkatb is only ever exercised by the
      # integration suite, and most of internal/ only by the unit suite.
      - name: integration suite and merged coverage
        run: make coverage

      # The number goes in the run's own summary, so it is visible on every run
      # and on every pull request without leaving GitHub.
      - name: report coverage
        id: cov
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$NF); print $NF}')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          {
            echo "## Coverage: ${pct}%"
            echo
            echo "Unit and integration suites merged, generated code excluded."
            echo "See \`scripts/coverage.sh\` for what is left out and why."
            echo
            echo '<details><summary>Per-package</summary>'
            echo
            echo '```'
            go tool cover -func=coverage.out | awk '{print $1, $NF}' | sed 's|github.com/Mi7teR/kafka-tb/||' | column -t
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # The badge is generated here and published to an orphan "badges" branch,
      # which the workflow's own triggers deliberately exclude — pushing to it
      # must not start another run. No third-party service is involved: Codecov
      # was tried first and did not work.
      # A badge is a report, not a gate. The first version of this step failed
      # the whole job on a 403, which also skipped the image job through its
      # needs: — so a cosmetic publish blocked a release. Never again.
      - name: publish the coverage badge
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/coverage-badge.sh "${{ steps.cov.outputs.pct }}" /tmp/coverage.svg
          tmp=$(mktemp -d)
          cd "$tmp"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/coverage.svg coverage.svg
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ) ${{ github.sha }} ${{ steps.cov.outputs.pct }}%" > coverage.txt
          git add coverage.svg coverage.txt
          git commit -q -m "coverage: ${{ steps.cov.outputs.pct }}% at ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:badges

  build-darwin:
    name: build (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # macOS only, and only a build. TigerBeetle ships a prebuilt static
      # library whose members are not 8-byte aligned, which Apple's current
      # linker refuses; the Makefile passes -ld_classic on Darwin to work around
      # it. That workaround is invisible on Linux, so without this job it would
      # rot unnoticed until the next person on a Mac hit the link error.
      - name: build
        run: make build

      - name: unit tests
        run: make test

  image:
    name: image (ghcr.io)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only publish what already passed. A broken image on ghcr is worse than no
    # image, because someone will pull it before the fix lands.
    needs: [test, lint, integration]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # linux/arm64 is built under emulation. Cross-compiling cgo would need a
      # cross toolchain in the builder; QEMU is slower but keeps the build
      # honest, and the TigerBeetle module ships a static library for both.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # v0.1.0 shipped an arm64 image containing an amd64 binary: the build
      # succeeded, the manifest listed both architectures, and the job passed.
      # Nothing executed what was built. Pull each advertised platform back and
      # run it, so a manifest that lies fails here instead of on a user's host.
      - name: the published image runs on every architecture it advertises
        run: |
          set -euo pipefail
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$platform"
            docker run --rm --platform "$platform" "$tag" --help > /dev/null
            echo "$platform ok"
            echo "::endgroup::"
          done
