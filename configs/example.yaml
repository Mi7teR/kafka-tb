# Operating mode: sink | api | all
mode: all
# TigerBeetle cluster connection
tigerbeetle:
  cluster_id: 0
  # Each address is a bare port or an IP:port with an IP literal (e.g.
  # "127.0.0.1:3000"). Hostnames are not supported: TigerBeetle's address
  # parser rejects them at connect time, not here.
  addresses: ["3000"]
# Batching behaviour for TigerBeetle writes
batcher:
  max_batch_size: 8189
  linger: 5ms
  # Queue depth of ONE worker, not of the batcher as a whole: with shards
  # workers per operation type the process can hold up to
  # max_queue × shards × 2 commands waiting.
  max_queue: 1000
  # How many independent workers the batcher runs per operation type. A command
  # goes to one of them by the hash of its ordering key — "topic/partition" for
  # Kafka records, empty (round-robin) for API requests. Commands sharing a key
  # therefore never fly at the same time and keep their submit order, while
  # different partitions pipeline. More shards means more concurrent requests to
  # TigerBeetle and more memory (see max_queue); 1 restores the old behaviour of
  # a single in-flight request per operation type. Defaults to 4.
  shards: 4
# Sink pipelining
sink:
  # How many of one partition's records the sink submits to the batcher before
  # it starts collecting their outcomes. A throughput/replay trade-off, not a
  # safety bound: on an ungraceful stop up to this many records per assigned
  # partition may be applied to TigerBeetle but neither published nor
  # committed — about 12k across 12 partitions at this value, a couple of
  # seconds of replay at current throughput — and they are reprocessed after
  # restart, producing duplicate results-topic messages. What keeps that safe
  # is TigerBeetle idempotency: command ids are stable across attempts, and
  # TransferExists/AccountExists map to StatusOK.
  #
  # Must not exceed batcher.max_queue + batcher.max_batch_size: all of one
  # partition's records carry the same ordering key and therefore queue on one
  # batcher worker, so that is the most a single partition could ever hold in
  # flight. It is not a protective ceiling — partitions whose keys hash to the
  # same worker share its queue, and then the enqueue blocks below that number.
  # Defaults to 1000, clamped to the ceiling when the batcher is configured
  # smaller.
  max_in_flight_per_partition: 1000
# Kafka consumer/producer settings
kafka:
  brokers: ["localhost:9092"]
  group: kafkatb
  topics:
    - {name: ledger.transfers, codec: json}
  dlq_topic: ledger.transfers.dlq
  results_topic: ledger.results
# Message size and shape limits
limits:
  max_message_bytes: 1048576
  max_events_per_message: 8189
  max_json_depth: 32
# API server listen addresses
api:
  grpc_addr: ":9090"
  http_addr: ":8080"
  max_page_size: 1000
# Ledger name -> TigerBeetle ledger id/scale mapping
ledgers:
  USD: {id: 1, scale: 2}
# Transfer code name -> TigerBeetle code mapping
codes:
  payment: 1
# Retry policy for TigerBeetle operations
retry: {initial: 100ms, max: 30s, jitter: true}
# Graceful shutdown timeout
shutdown_timeout: 30s
# Listen address for /metrics, /healthz and /readyz. Must not collide with
# api.http_addr: that port is already owned by the grpc-gateway REST mux in
# api/sink modes.
metrics_addr: ":9464"
