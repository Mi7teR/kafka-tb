# TigerBeetle cluster connection
tigerbeetle:
  cluster_id: 0
  # Each address is a bare port or an IP:port with an IP literal (e.g.
  # "127.0.0.1:3000"). Hostnames are not supported: TigerBeetle's address
  # parser rejects them at connect time, not here.
  addresses: ["3000"]
# Batching behaviour for TigerBeetle writes
batcher:
  max_batch_size: 8189
  # How long a worker waits for more commands before sending what it has.
  # Measured, not guessed: at 1 partition the sweep is clean and monotonic —
  # 1ms gives 22,281 rec/sec, 5ms 16,701, 50ms 10,102. Mean batch size is
  # identical at 1ms and 5ms (428.7), so the coalescing does not come from the
  # timer waiting at all; it comes from the sink submitting a partition's
  # records pipelined, without awaiting each outcome, which keeps a batch
  # filling while the previous one is in flight. A longer linger therefore buys
  # no extra batching and only adds latency to the last command in the batch.
  linger: 1ms
  # Queue depth of the batcher's single queue, which is the batcher as a whole:
  # one worker serves both operation types, so commands of every operation
  # share this queue. The worker also holds up to max_batch_size events in the
  # batch it is assembling or sending, so the process can hold up to
  # max_queue + max_batch_size — 9,189 at these values.
  max_queue: 1000
# Sink pipelining
sink:
  # How many of one partition's records the sink submits to the batcher before
  # it starts collecting their outcomes. A throughput/replay trade-off, not a
  # safety bound: on an ungraceful stop up to this many records per assigned
  # partition may be applied to TigerBeetle but neither published nor
  # committed — about 12k across 12 partitions at this value, a couple of
  # seconds of replay at current throughput — and they are reprocessed after
  # restart, producing duplicate results-topic messages. What keeps that safe
  # is TigerBeetle idempotency: command ids are stable across attempts, and
  # TransferExists/AccountExists map to StatusOK.
  #
  # Must not exceed batcher.max_queue + batcher.max_batch_size: that is the
  # most a single partition could ever hold in flight. It is not a protective
  # ceiling — the batcher queue is shared by all partitions, so with several of
  # them the enqueue blocks at a fraction of that number. Defaults to 1000,
  # clamped to the ceiling when the batcher is configured smaller.
  max_in_flight_per_partition: 1000
# TigerBeetle -> Kafka change-data-capture job
cdc:
  # Output topic. Empty (or absent) disables the job: `kafkatb run` then
  # starts the sink alone and `kafkatb cdc` refuses to start.
  topic: ledger.events
  # How many change events one window asks TigerBeetle for. The whole window
  # is published and acknowledged before the cursor moves past it.
  batch_size: 1000
  # How long to wait before asking again when TigerBeetle has nothing new.
  poll_interval: 1s
  # Which field becomes the Kafka record key, and therefore which ordering a
  # consumer of this topic gets: debit_account_id (default),
  # credit_account_id, ledger or transfer_id.
  partition_key: debit_account_id
# Kafka consumer/producer settings
kafka:
  brokers: ["localhost:9092"]
  group: kafkatb
  topics:
    - {name: ledger.transfers, codec: json}
  dlq_topic: ledger.transfers.dlq
  results_topic: ledger.results
# Message size and shape limits
limits:
  max_message_bytes: 1048576
  max_events_per_message: 8189
  max_json_depth: 32
# Ledger name -> TigerBeetle ledger id/scale mapping
ledgers:
  USD: {id: 1, scale: 2}
# Transfer code name -> TigerBeetle code mapping
codes:
  payment: 1
# Retry policy for TigerBeetle operations
retry: {initial: 100ms, max: 30s, jitter: true}
# Graceful shutdown timeout
shutdown_timeout: 30s
# Listen address for /metrics, /healthz and /readyz.
metrics_addr: ":9464"
